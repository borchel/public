<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Psychedelic AR Garden</title><style>body{margin:0;background:#111;color:white;font:14px system-ui}header{padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:10px;border:0;border-radius:8px}#ar{background:#087e75;color:white}#v{height:calc(100vh - 80px);position:relative}#place,#act{display:none;position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:20px}#act{bottom:70px;background:#8b3dc5;color:white}</style></head><body><header><b>Psychedelic AR Garden</b><button id="ar" disabled>AR prüfen…</button><span id="s">Lade…</span></header><div id="v"><button id="act">✨ Interagieren</button><button id="place">🌿 Garten platzieren</button></div><script type="module">
const T=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/+esm'),v=document.querySelector('#v'),ar=document.querySelector('#ar'),s=document.querySelector('#s'),place=document.querySelector('#place'),act=document.querySelector('#act');
const scene=new T.Scene(),cam=new T.PerspectiveCamera(70,1,.03,50),r=new T.WebGLRenderer({alpha:true,antialias:true});r.xr.enabled=true;r.setPixelRatio(Math.min(devicePixelRatio,2));v.prepend(r.domElement);scene.add(new T.HemisphereLight(0xffffff,0x446644,3));
const garden=new T.Group();garden.visible=false;scene.add(garden);const base=new T.Mesh(new T.CircleGeometry(2.2,48),new T.MeshStandardMaterial({color:0x39b85a,transparent:true,opacity:.35,depthWrite:false}));base.rotation.x=-Math.PI/2;garden.add(base);
const mush=[];function add(x,z,h,hue){let g=new T.Group(),c=new T.Color().setHSL(hue,1,.58),m=new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.2});g.position.set(x,0,z);let st=new T.Mesh(new T.CylinderGeometry(.05,.08,h*.6,10),new T.MeshStandardMaterial({color:0xffe8cf}));st.position.y=h*.3;g.add(st);let cp=new T.Mesh(new T.SphereGeometry(h*.25,18,10,0,Math.PI*2,0,Math.PI/2),m);cp.position.y=h*.6;g.add(cp);g.userData={m};garden.add(g);mush.push(g)}
add(-1,-.5,.7,.85);add(.8,-1,.85,.5);add(1,.6,.6,.12);add(-.5,1,.75,.7);add(.2,.2,.5,.96);
const portal=new T.Mesh(new T.TorusGeometry(.55,.07,12,40),new T.MeshStandardMaterial({color:0x55ddff,emissive:0x22bbff,emissiveIntensity:3}));portal.position.set(0,1,-1.7);garden.add(portal);
for(let i=0;i<40;i++){let c=new T.Color().setHSL(Math.random(),1,.6),q=new T.Mesh(new T.SphereGeometry(.025,6,5),new T.MeshBasicMaterial({color:c}));let a=Math.random()*6.28,d=.3+Math.random()*1.9;q.position.set(Math.cos(a)*d,.2+Math.random()*1.7,Math.sin(a)*d);q.userData={b:q.position.y,p:Math.random()*6.28};garden.add(q)}
const ret=new T.Mesh(new T.RingGeometry(.08,.11,32),new T.MeshBasicMaterial({color:0x22ffff,side:T.DoubleSide}));ret.rotation.x=-Math.PI/2;ret.matrixAutoUpdate=false;ret.visible=false;scene.add(ret);
let hs,local,lastPose,placed=false;
if(navigator.xr){let ok=await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);ar.disabled=!ok;ar.textContent=ok?'Enter AR':'AR nicht verfügbar';s.textContent=ok?'AR bereit':'Browser/Gerät unterstützt immersive-ar nicht'}else s.textContent='Kein WebXR';
ar.onclick=async()=>{try{let ses=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});r.xr.setReferenceSpaceType('local');await r.xr.setSession(ses);local=await ses.requestReferenceSpace('local');let viewer=await ses.requestReferenceSpace('viewer');hs=await ses.requestHitTestSource({space:viewer});s.textContent='Boden langsam scannen';ses.addEventListener('end',()=>location.reload())}catch(e){s.textContent='AR-Fehler: '+e.message}};
place.onclick=()=>{if(lastPose){let p=lastPose.transform.position;garden.position.set(p.x,p.y,p.z);garden.visible=true;placed=true;ret.visible=false;place.style.display='none';act.style.display='block';s.textContent='Garten platziert – gehe real darum herum'}};
act.onclick=()=>{mush.forEach((g,i)=>{g.userData.m.emissiveIntensity=4;g.scale.setScalar(1.25)});setTimeout(()=>mush.forEach(g=>{g.userData.m.emissiveIntensity=1.2;g.scale.setScalar(1)}),700);s.textContent='✨ Garten aktiviert'};
function resize(){let w=v.clientWidth,h=v.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}new ResizeObserver(resize).observe(v);resize();
r.setAnimationLoop((t,f)=>{if(f&&hs&&!placed){let h=f.getHitTestResults(hs);if(h.length){lastPose=h[0].getPose(local);ret.visible=true;ret.matrix.fromArray(lastPose.transform.matrix);place.style.display='block'}else{ret.visible=false;place.style.display='none'}}garden.children.forEach(o=>{if(o.userData.b!==undefined)o.position.y=o.userData.b+Math.sin(t*.002+o.userData.p)*.08});portal.rotation.y+=.01;r.render(scene,cam)});
</script></body></html>
