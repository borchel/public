<!doctype html><html lang=de><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Psychedelic Portal Garden</title><link rel=manifest href=./manifest.webmanifest><meta name=theme-color content=#100018>

<body><div id=bar><b>Psychedelic Portal</b><label>Portalabstand VR <input id=portalDistance type=number min=0.5 max=20 step=0.1 value=1.0> m</label><button id=start>Start</button><span id=st>Prüfe Gerät…</span></div><div id=view></div><div id=joy><div id=nub></div></div><div id=look></div>
<script type=module>
const T=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/+esm'),$=q=>document.querySelector(q),st=$('#st'),start=$('#start'),view=$('#view'),portalDistanceInput=$('#portalDistance');let portalDistance=1.0;
const mobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);if(mobile)document.body.classList.add('mobile');
const S=new T.Scene(),C=new T.PerspectiveCamera(70,1,.03,120),R=new T.WebGLRenderer({alpha:true,antialias:true});R.xr.enabled=true;R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputColorSpace=T.SRGBColorSpace;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.35;view.append(R.domElement);S.add(new T.HemisphereLight(0xffffff,0x332255,3));
const rig=new T.Group();rig.add(C);S.add(rig);C.position.set(0,1.65,3.5);

/* portal + AR garden */
const A=new T.Group();A.visible=false;S.add(A);const patch=new T.Mesh(new T.CircleGeometry(2.5,48),new T.MeshStandardMaterial({color:0x39aa58,transparent:true,opacity:.22,depthWrite:false}));patch.rotation.x=-Math.PI/2;A.add(patch);
const P=new T.Group();P.position.set(0,1.15,-1.55);A.add(P);const rm=new T.MeshStandardMaterial({color:0xff1010,emissive:0xff0000,emissiveIntensity:9});const ring=new T.Mesh(new T.TorusGeometry(.82,.09,16,56),rm);P.add(ring);const entryHalo=new T.Mesh(new T.TorusGeometry(1.02,.035,10,64),new T.MeshBasicMaterial({color:0xff0000,transparent:true,opacity:.9,depthTest:false}));P.add(entryHalo);P.add(new T.Mesh(new T.CircleGeometry(.73,48),new T.MeshBasicMaterial({color:0xff0000,transparent:true,opacity:.28,side:T.DoubleSide})));
for(let i=0;i<10;i++){let c=new T.Color().setHSL(i/10,1,.62),o=new T.Mesh(new T.SphereGeometry(.08+Math.random()*.07,9,6),new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:2}));let a=i/10*Math.PI*2,d=1+Math.random();o.position.set(Math.cos(a)*d,.15+Math.random()*.6,Math.sin(a)*d);A.add(o)}

/* psychedelic virtual garden */
const V=new T.Group();V.visible=false;A.add(V);const floor=new T.Mesh(new T.PlaneGeometry(75,75),new T.MeshStandardMaterial({color:0x220036,emissive:0x3a005c,emissiveIntensity:1.5}));floor.rotation.x=-Math.PI/2;V.add(floor);const sky=new T.Mesh(new T.SphereGeometry(38,32,20),new T.MeshBasicMaterial({color:0x14002f,side:T.BackSide}));V.add(sky);
const rings=[],pts=[],moves=[];
for(let i=0;i<20;i++){let c=new T.Color().setHSL(i/20,1,.62),o=new T.Mesh(new T.TorusGeometry(2.7+.4*Math.sin(i),.06,8,48),new T.MeshBasicMaterial({color:c}));o.position.set(Math.sin(i)*.7,2.4,-4-i*1.5);o.rotation.z=i*.3;V.add(o);rings.push(o)}
for(let i=0;i<300;i++){let c=new T.Color().setHSL(Math.random(),1,.7),o=new T.Mesh(new T.SphereGeometry(.025+Math.random()*.055,6,4),new T.MeshBasicMaterial({color:c}));o.position.set((Math.random()-.5)*35,.2+Math.random()*12,-2-Math.random()*35);o.userData={b:o.position.y,p:Math.random()*6.28};V.add(o);pts.push(o)}
for(let i=0;i<40;i++){let c=new T.Color().setHSL(Math.random(),1,.6),o=new T.Mesh(new T.IcosahedronGeometry(.2+Math.random()*.45,1),new T.MeshBasicMaterial({color:c,wireframe:i%2==0}));o.position.set((Math.random()-.5)*15,.5+Math.random()*5,-3-Math.random()*27);o.userData={p:Math.random()*6.28};V.add(o);moves.push(o)}
const sun=new T.Mesh(new T.SphereGeometry(2.2,24,16),new T.MeshBasicMaterial({color:0xff22cc}));sun.position.set(0,7,-28);V.add(sun);
const vegetation=[];
function psychMat(h){let c=new T.Color().setHSL(h,1,.58);let m=new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.8,roughness:.45});m.userData.h=h;return m}
function addMushroom(x,z,s,h){let g=new T.Group(),stem=new T.Mesh(new T.CylinderGeometry(.08*s,.13*s,.65*s,8),psychMat((h+.13)%1));stem.position.y=.33*s;g.add(stem);let cap=new T.Mesh(new T.SphereGeometry(.34*s,14,8,0,Math.PI*2,0,Math.PI*.55),psychMat(h));cap.position.y=.68*s;cap.scale.y=.55;g.add(cap);g.position.set(x,0,z);g.userData={p:Math.random()*6.28,k:'m'};V.add(g);vegetation.push(g)}
function addFlower(x,z,s,h){let g=new T.Group(),stem=new T.Mesh(new T.CylinderGeometry(.025*s,.035*s,.75*s,6),psychMat((h+.32)%1));stem.position.y=.38*s;g.add(stem);for(let i=0;i<7;i++){let p=new T.Mesh(new T.SphereGeometry(.13*s,8,5),psychMat((h+i*.025)%1));let a=i/7*Math.PI*2;p.position.set(Math.cos(a)*.17*s,.78*s,Math.sin(a)*.17*s);p.scale.set(1.45,.55,.75);g.add(p)}let core=new T.Mesh(new T.SphereGeometry(.11*s,8,6),psychMat((h+.5)%1));core.position.y=.78*s;g.add(core);g.position.set(x,0,z);g.userData={p:Math.random()*6.28,k:'f'};V.add(g);vegetation.push(g)}
function addFern(x,z,s,h){let g=new T.Group();for(let j=0;j<6;j++){let a=(j/6)*Math.PI*2;let stem=new T.Mesh(new T.CylinderGeometry(.018*s,.025*s,.9*s,5),psychMat((h+j*.025)%1));stem.position.set(Math.cos(a)*.18*s,.42*s,Math.sin(a)*.18*s);stem.rotation.z=Math.sin(a)*.65;stem.rotation.x=Math.cos(a)*.65;g.add(stem);for(let k=1;k<5;k++){for(let side of [-1,1]){let leaf=new T.Mesh(new T.SphereGeometry(.075*s,7,4),psychMat((h+.08*k)%1));leaf.scale.set(1.8,.32,.65);leaf.position.set(Math.cos(a)*(.08+.1*k)*s+Math.cos(a+Math.PI/2)*side*.08*s*k,.18*s+.11*k*s,Math.sin(a)*(.08+.1*k)*s+Math.sin(a+Math.PI/2)*side*.08*s*k);g.add(leaf)}}}g.position.set(x,0,z);g.userData={p:Math.random()*6.28,k:'fern'};V.add(g);vegetation.push(g)}
function addLeafPlant(x,z,s,h){let g=new T.Group();for(let i=0;i<9;i++){let a=i/9*Math.PI*2,leaf=new T.Mesh(new T.SphereGeometry(.22*s,9,5),psychMat((h+i*.035)%1));leaf.scale.set(.5,2,.28);leaf.position.set(Math.cos(a)*.25*s,.3*s+Math.random()*.25*s,Math.sin(a)*.25*s);leaf.rotation.z=-Math.cos(a)*.65;leaf.rotation.x=Math.sin(a)*.65;g.add(leaf)}g.position.set(x,0,z);g.userData={p:Math.random()*6.28,k:'leaf'};V.add(g);vegetation.push(g)}
for(let i=0;i<34;i++){let a=Math.random()*Math.PI*2,d=3+Math.random()*17,x=Math.cos(a)*d,z=-4-Math.random()*28;addMushroom(x,z,.65+Math.random()*1.5,Math.random())}
for(let i=0;i<30;i++){let x=(Math.random()-.5)*24,z=-3-Math.random()*30;addFlower(x,z,.7+Math.random()*1.4,Math.random())}
for(let i=0;i<24;i++){let x=(Math.random()-.5)*25,z=-3-Math.random()*30;addFern(x,z,.7+Math.random()*1.25,Math.random())}
for(let i=0;i<24;i++){let x=(Math.random()-.5)*25,z=-3-Math.random()*30;addLeafPlant(x,z,.7+Math.random()*1.3,Math.random())}

/* return portal, visible only in virtual garden */
const RP=new T.Group();V.add(RP);
function updateReturnPortalPosition(){
  // Portal center distance measured along the virtual garden's forward axis.
  // Entry portal P is at z=-1.55 in the shared world. Return portal is
  // portalDistance metres farther into the VR garden.
  RP.position.set(0,1.15,P.position.z-portalDistance);
}
updateReturnPortalPosition();
const rrm=new T.MeshStandardMaterial({color:0xff1010,emissive:0xff0000,emissiveIntensity:10});
const rring=new T.Mesh(new T.TorusGeometry(.9,.1,16,56),rrm);RP.add(rring);const returnHalo=new T.Mesh(new T.TorusGeometry(1.12,.04,10,64),new T.MeshBasicMaterial({color:0xff0000,transparent:true,opacity:.95,depthTest:false}));RP.add(returnHalo);
const rdisc=new T.Mesh(new T.CircleGeometry(.79,48),new T.MeshBasicMaterial({color:0xff0000,transparent:true,opacity:.30,side:T.DoubleSide}));RP.add(rdisc);


/* warp */
const warp=new T.Group();warp.visible=false;S.add(warp);const shell=new T.Mesh(new T.SphereGeometry(1.8,24,16),new T.MeshBasicMaterial({color:0x5c008f,side:T.BackSide,transparent:true,opacity:0,depthTest:false}));warp.add(shell);const streaks=[];for(let i=0;i<80;i++){let c=new T.Color().setHSL(Math.random(),1,.68),o=new T.Mesh(new T.CylinderGeometry(.008,.018,.8+Math.random()*1.5,5),new T.MeshBasicMaterial({color:c,depthTest:false})),a=Math.random()*6.28,r=.2+Math.random()*1.3;o.position.set(Math.cos(a)*r,Math.sin(a)*r,-Math.random()*5);o.rotation.x=Math.PI/2;o.userData={sp:2+Math.random()*5,h:Math.random()};warp.add(o);streaks.push(o)}
let warping=false,wt=0;

/* AR hit testing */
const ret=new T.Mesh(new T.RingGeometry(.08,.14,32),new T.MeshBasicMaterial({color:0x22ffff,side:T.DoubleSide,depthTest:false}));ret.rotation.x=-Math.PI/2;ret.matrixAutoUpdate=false;ret.visible=false;S.add(ret);
let arOK=false,vrOK=false,ses=null,ref=null,hitSrc=null,lastHit=null,placed=false,state='portal',armed=false,fallback=false,portalPhase='idle',placedAt=0,lastPortalZ=null,returnPhase='idle',returnZ=null,returnTarget='garden';
const head=new T.Vector3(),pl=new T.Vector3();
const ctrls=[0,1].map(i=>{let c=R.xr.getController(i);S.add(c);let l=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(),new T.Vector3(0,0,-1)]),new T.LineBasicMaterial({color:0xffffff}));l.scale.z=3;c.add(l);c.addEventListener('selectstart',()=>{if(lastHit&&!placed)place(lastHit)});return c});
function place(h){let p=h.getPose(ref);if(!p)return;let m=new T.Matrix4().fromArray(p.transform.matrix),pos=new T.Vector3(),q=new T.Quaternion(),sc=new T.Vector3();m.decompose(pos,q,sc);A.position.copy(pos);C.getWorldPosition(head);A.rotation.set(0,Math.atan2(head.x-pos.x,head.z-pos.z),0);A.visible=true;placed=true;ret.visible=false;portalPhase='settling';placedAt=performance.now();lastPortalZ=null;armed=false;st.textContent='Portal platziert – bleibe kurz davor, dann gehe durch den Ring.'}
function portalCheck(){
 if(!placed||warping||state!=='portal')return;
 C.getWorldPosition(head);P.worldToLocal(pl.copy(head));
 const open=Math.abs(pl.x)<.78&&Math.abs(pl.y)<1.05;
 const now=performance.now();

 // Never allow a transition immediately after placement.
 if(portalPhase==='settling'){
   rm.emissiveIntensity=5;
   if(now-placedAt<1200){lastPortalZ=pl.z;return}
   portalPhase='waitingFront';
   st.textContent='Portal steht in AR/MR – gehe zunächst vor den leuchtenden Ring.';
 }

 // Establish an unambiguous "front side" before arming.
 if(portalPhase==='waitingFront'){
   if(pl.z>0.45 && pl.z<2.2){
     portalPhase='armed';armed=true;lastPortalZ=pl.z;rm.emissiveIntensity=8;
     st.textContent='Portal bereit – jetzt durch den Ring gehen.';
   } else {
     lastPortalZ=pl.z;return;
   }
 }

 if(portalPhase==='armed'){
   // Must cross from clearly positive z to clearly negative z while inside aperture.
   const crossed = lastPortalZ!==null && lastPortalZ>0.10 && pl.z<-0.10;
   if(open && crossed){
     portalPhase='crossed';armed=false;beginWarp('garden');lastPortalZ=pl.z;return;
   }
   // Keep tracking; walking around the side must not trigger.
   if(pl.z>0.10) lastPortalZ=pl.z;
   if(Math.abs(pl.x)>1.4 || Math.abs(pl.y)>1.5){
     // user is outside portal aperture; still armed, but no crossing is accepted
     rm.emissiveIntensity=6;
   } else rm.emissiveIntensity=9;
 }
}function beginWarp(target='garden'){armed=false;warping=true;wt=0;warp.visible=true;state='warp';returnTarget=target;st.textContent=target==='garden'?'WARP → psychedelischer Garten':'WARP → AR/MR Welt'}
function updateWarp(dt,t){if(!warping)return;wt+=dt;let u=Math.min(1,wt/1.8);C.getWorldPosition(head);warp.position.copy(head);warp.quaternion.copy(C.quaternion);shell.material.opacity=Math.sin(Math.PI*u)*.95;shell.material.color.setHSL((t*.0003)%1,1,.2);streaks.forEach(o=>{o.position.z+=dt*o.userData.sp*(1+u*8);if(o.position.z>1)o.position.z=-5;o.scale.y=1+u*5;o.material.color.setHSL((t*.0004+o.userData.h)%1,1,.7)});if(u>.48&&!warp.userData.sw){warp.userData.sw=1;if(returnTarget==='garden'){V.visible=true;patch.visible=false;S.background=new T.Color(0x100018)}else{V.visible=false;patch.visible=true;S.background=ses?null:new T.Color(0x87bde8)}}if(u>=1){warping=false;warp.visible=false;warp.userData.sw=0;if(returnTarget==='garden'){state='garden';returnPhase='settling';returnZ=null;R.toneMappingExposure=1.55;st.textContent=`Psychedelischer Garten – rotes Rückportal in ${portalDistance.toFixed(1)} m Abstand.`}else{state='portal';portalPhase='settling';placedAt=performance.now();lastPortalZ=null;R.toneMappingExposure=1.35;st.textContent='Zurück in AR/MR – Portal bleibt vor dir sichtbar.'}}}


function returnPortalCheck(){
 if(state!=='garden'||warping)return;
 C.getWorldPosition(head);RP.worldToLocal(pl.copy(head));
 const open=Math.abs(pl.x)<.88&&Math.abs(pl.y)<1.15;
 const z=pl.z;

 if(returnPhase==='settling'){
   // Arm from EITHER side. This avoids assumptions about the portal's
   // local front direction after world placement/rotation.
   if(Math.abs(z)>.48 && Math.abs(z)<2.6){
     returnPhase='armed';returnZ=z;rrm.emissiveIntensity=14;
     st.textContent='ROTES RÜCKPORTAL bereit – jetzt durch den roten Ring gehen.';
   } else {returnZ=z;return}
 }

 if(returnPhase==='armed'){
   // A real crossing means the sign of local Z changes while the head
   // is physically inside the portal aperture. A small dead-zone
   // prevents jitter around the plane from triggering it.
   const crossed=returnZ!==null &&
     ((returnZ>.10 && z<-.10)||(returnZ<-.10 && z>.10));
   if(open&&crossed){
     returnPhase='crossed';beginWarp('ar');returnZ=z;return;
   }
   // Preserve the last position only while clearly away from the plane.
   if(Math.abs(z)>.10)returnZ=z;
   rrm.emissiveIntensity=open?15:11;
 }
}
/* desktop/mobile fallback portal */
function fallbackStart(){fallback=true;S.background=new T.Color(0x87bde8);A.visible=true;A.position.set(0,0,0);A.rotation.set(0,0,0);placed=true;portalPhase='settling';placedAt=performance.now();lastPortalZ=null;rig.position.set(0,0,3.5);C.position.set(0,1.65,0);st.textContent='3D-Portal-Fallback – nähere dich erst dem Portal und gehe dann hindurch.'}

/* capability-first start */
async function caps(){if(navigator.xr){arOK=await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);vrOK=await navigator.xr.isSessionSupported('immersive-vr').catch(()=>false)}st.textContent=`AR/MR ${arOK?'✓':'–'} · VR ${vrOK?'✓':'–'} · 3D ✓`;start.textContent=arOK?'AR/MR Portal starten':'3D Portal starten'}
caps();
start.onclick=async()=>{
 portalDistance=Math.max(.5,Math.min(20,parseFloat(portalDistanceInput.value)||1));
 portalDistanceInput.value=portalDistance.toFixed(1);
 portalDistanceInput.disabled=true;
 updateReturnPortalPosition();
 st.textContent=`Portalabstand: ${portalDistance.toFixed(1)} m`;
 if(!arOK){fallbackStart();return}
 try{ses=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['local-floor','anchors','plane-detection']});R.xr.setReferenceSpaceType('local-floor');await R.xr.setSession(ses);ref=await ses.requestReferenceSpace('local-floor').catch(()=>ses.requestReferenceSpace('local'));let viewer=await ses.requestReferenceSpace('viewer');hitSrc=await ses.requestHitTestSource({space:viewer});S.background=null;A.visible=false;st.textContent='Boden erfassen. Ring positionieren, dann Trigger/Touch.';ses.addEventListener('end',()=>location.reload())}catch(e){fallbackStart()}};
R.domElement.addEventListener('pointerdown',()=>{if(ses&&lastHit&&!placed)place(lastHit)});

/* controls */
let yaw=0,pitch=0,keys={},jx=0,jy=0,lx=0,ly=0;addEventListener('keydown',e=>keys[e.code]=1);addEventListener('keyup',e=>keys[e.code]=0);R.domElement.addEventListener('click',()=>{if(!mobile&&!R.xr.isPresenting&&fallback)R.domElement.requestPointerLock?.()});addEventListener('mousemove',e=>{if(document.pointerLockElement===R.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*.0025))}});
const joy=$('#joy'),nub=$('#nub');function jm(e){let r=joy.getBoundingClientRect(),t=e.touches[0],x=t.clientX-r.left-r.width/2,y=t.clientY-r.top-r.height/2,d=Math.max(1,Math.hypot(x,y)),k=Math.min(40,d)/d;jx=x*k/40;jy=y*k/40;nub.style.transform=`translate(${x*k}px,${y*k}px)`}joy.addEventListener('touchstart',jm);joy.addEventListener('touchmove',jm);joy.addEventListener('touchend',()=>{jx=jy=0;nub.style.transform=''});
const look=$('#look');look.addEventListener('touchstart',e=>{lx=e.touches[0].clientX;ly=e.touches[0].clientY});look.addEventListener('touchmove',e=>{let t=e.touches[0];yaw-=(t.clientX-lx)*.006;pitch=Math.max(-1.2,Math.min(1.2,pitch-(t.clientY-ly)*.006));lx=t.clientX;ly=t.clientY});

function resize(){if(R.xr.isPresenting)return;R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener('resize',resize);resize();let last=performance.now();
R.setAnimationLoop((t,frame)=>{let dt=Math.min(.04,(t-last)/1000);last=t;if(frame&&ses&&hitSrc&&!placed){let h=frame.getHitTestResults(hitSrc);lastHit=h[0]||null;if(lastHit){let p=lastHit.getPose(ref);if(p){ret.visible=true;ret.matrix.fromArray(p.transform.matrix)}}else ret.visible=false}
if(!R.xr.isPresenting&&fallback){C.rotation.order='YXZ';C.rotation.y=yaw;C.rotation.x=pitch;let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-jy,r=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jx,sp=2.7*dt;rig.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*r)*sp;rig.position.z+=(-Math.cos(yaw)*f+Math.sin(yaw)*r)*sp}
portalCheck();returnPortalCheck();updateWarp(dt,t);ring.rotation.z+=dt*.8;rring.rotation.z-=dt*.9;
let pulse=1+.10*Math.sin(t*.006);entryHalo.scale.setScalar(pulse);returnHalo.scale.setScalar(pulse);
entryHalo.material.opacity=.65+.3*(.5+.5*Math.sin(t*.008));returnHalo.material.opacity=.7+.28*(.5+.5*Math.sin(t*.008));if(state==='garden'){let tt=t*.001;sky.material.color.setHSL((tt*.025)%1,.95,.09);sun.scale.setScalar(1+.2*Math.sin(tt*3));sun.material.color.setHSL((tt*.08+.88)%1,1,.62);rings.forEach((o,i)=>{o.rotation.z+=dt*(.2+i*.01)*(i%2?1:-1);o.scale.setScalar(1+.1*Math.sin(tt*2+i));o.material.color.setHSL((tt*.06+i/20)%1,1,.63)});pts.forEach(o=>{o.position.y=o.userData.b+Math.sin(tt*1.5+o.userData.p)*.3;o.material.color.setHSL((tt*.05+o.userData.p/6.28)%1,1,.7)});moves.forEach((o,i)=>{o.rotation.x+=dt*(.2+i%4*.05);o.rotation.y+=dt*(.3+i%5*.05);o.scale.setScalar(1+.15*Math.sin(tt*2+o.userData.p))});vegetation.forEach((g,i)=>{let w=1+.08*Math.sin(tt*2.2+g.userData.p);g.scale.set(w,1+.12*Math.sin(tt*1.7+g.userData.p),w);g.rotation.y+=dt*(g.userData.k==='f'?.12:.035);g.children.forEach((m,j)=>{if(m.material&&m.material.userData&&m.material.userData.h!==undefined){m.material.color.setHSL((m.material.userData.h+tt*.035+j*.006)%1,1,.58);m.material.emissive.copy(m.material.color);m.material.emissiveIntensity=1.5+.9*Math.sin(tt*2+g.userData.p+j)}})});rdisc.material.color.setRGB(1,0,0);floor.material.emissiveIntensity=1.5+.8*Math.sin(tt*2)}
R.render(S,C)});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
