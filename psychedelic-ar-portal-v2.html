<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Psychedelic AR Portal v2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10121a;color:#fff;font:14px system-ui}
header{padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{padding:10px 14px;border:1px solid #596170;border-radius:9px;background:#252b38;color:#fff}
#ar{background:#087e75}button:disabled{opacity:.4}#view{height:calc(100vh - 85px);position:relative;overflow:hidden}
#place{display:none;position:absolute;z-index:5;left:50%;bottom:22px;transform:translateX(-50%);background:#087e75}
#msg{color:#c8ced9}.badge{padding:4px 8px;border-radius:10px;background:#292f3c}
</style></head>
<body><header><b>AR ⇄ Virtual Portal v2</b><button id="ar" disabled>AR prüfen…</button><span id="mode" class="badge">Desktop</span><span id="msg">Lade…</span></header>
<div id="view"><button id="place">Portal platzieren</button></div>
<script type="module">
const T=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/+esm'),$=s=>document.querySelector(s);
const view=$('#view'),ar=$('#ar'),place=$('#place'),msg=$('#msg'),modeEl=$('#mode');
const scene=new T.Scene(),cam=new T.PerspectiveCamera(70,1,.03,120),ren=new T.WebGLRenderer({alpha:true,antialias:true});
ren.xr.enabled=true;ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.outputColorSpace=T.SRGBColorSpace;ren.toneMapping=T.ACESFilmicToneMapping;ren.toneMappingExposure=1.3;view.prepend(ren.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x333355,3));

/* Anchor holding portal + MR garden */
const anchor=new T.Group();anchor.visible=false;scene.add(anchor);
const gardenFloor=new T.Mesh(new T.CircleGeometry(2.8,48),new T.MeshStandardMaterial({color:0x39ad5b,transparent:true,opacity:.24,depthWrite:false}));
gardenFloor.rotation.x=-Math.PI/2;anchor.add(gardenFloor);
for(let i=0;i<12;i++){let c=new T.Color().setHSL(i/12,.95,.6),m=new T.Mesh(new T.SphereGeometry(.09+Math.random()*.08,12,8),new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.5}));let a=i/12*Math.PI*2,d=1+Math.random()*1.4;m.position.set(Math.cos(a)*d,.15+Math.random()*.8,Math.sin(a)*d);anchor.add(m)}

/* Portal faces local +Z; virtual zone is local -Z */
const portal=new T.Group();portal.position.set(0,1.15,-1.8);anchor.add(portal);
const ringMat=new T.MeshStandardMaterial({color:0x55ddff,emissive:0x22bbff,emissiveIntensity:4,side:T.DoubleSide});
const ring=new T.Mesh(new T.TorusGeometry(.82,.09,16,56),ringMat);portal.add(ring);
const veilMat=new T.MeshBasicMaterial({color:0x843cff,transparent:true,opacity:.35,side:T.DoubleSide});
const veil=new T.Mesh(new T.CircleGeometry(.73,48),veilMat);portal.add(veil);

/* Virtual world is positioned relative to anchor */
const virtual=new T.Group();virtual.visible=false;anchor.add(virtual);
const vf=new T.Mesh(new T.PlaneGeometry(80,80),new T.MeshStandardMaterial({color:0x160322,emissive:0x090014,emissiveIntensity:.7}));
vf.rotation.x=-Math.PI/2;virtual.add(vf);
for(let i=0;i<220;i++){let c=new T.Color().setHSL(Math.random(),1,.62),p=new T.Mesh(new T.SphereGeometry(.02+Math.random()*.06,7,5),new T.MeshBasicMaterial({color:c}));
p.position.set((Math.random()-.5)*45,.2+Math.random()*12,(Math.random()-.5)*45);p.userData={base:p.position.y,phase:Math.random()*6.28};virtual.add(p)}
for(let i=0;i<45;i++){let c=new T.Color().setHSL(Math.random(),.95,.56),h=.5+Math.random()*1.8,g=new T.Group();
let stem=new T.Mesh(new T.CylinderGeometry(.05,.12,h*.65,8),new T.MeshStandardMaterial({color:0xeee0c8}));stem.position.y=h*.32;g.add(stem);
let cap=new T.Mesh(new T.SphereGeometry(h*.25,14,8,0,Math.PI*2,0,Math.PI/2),new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.8}));cap.position.y=h*.65;g.add(cap);
g.position.set((Math.random()-.5)*24,0,-4-Math.random()*28);virtual.add(g)}
for(let z=0;z<14;z++){let c=new T.Color().setHSL(z/14,.95,.58),t=new T.Mesh(new T.TorusGeometry(3,.07,10,48),new T.MeshBasicMaterial({color:c}));t.position.set(0,2.2,-5-z*2);virtual.add(t)}

/* full-view transition sphere follows head */
const transitionSphere=new T.Mesh(new T.SphereGeometry(2,32,20),new T.MeshBasicMaterial({color:0x6c24d8,side:T.BackSide,transparent:true,opacity:0,depthTest:false}));
transitionSphere.renderOrder=999;transitionSphere.visible=false;scene.add(transitionSphere);

/* hit test */
const ret=new T.Mesh(new T.RingGeometry(.08,.12,32),new T.MeshBasicMaterial({color:0x22ffff,side:T.DoubleSide}));
ret.rotation.x=-Math.PI/2;ret.matrixAutoUpdate=false;ret.visible=false;scene.add(ret);
let hs,local,lastPose,placed=false,state='ar',armedIn=false,armedOut=false,fade=0,fadeDir=0,last=performance.now();
const headWorld=new T.Vector3(),headLocal=new T.Vector3();

/* Zone logic in portal-local coordinates.
   Front approach: z > .15. Crossing: z < -.15 while within portal width/height. */
function portalCoords(){
 cam.getWorldPosition(headWorld);
 portal.worldToLocal(headLocal.copy(headWorld));
 return headLocal;
}
function updatePortal(){
 if(!placed||fadeDir!==0)return;
 const p=portalCoords(), insideOpening=Math.abs(p.x)<.72 && Math.abs(p.y)<1.05;
 if(state==='ar'){
   if(insideOpening && p.z>.18 && p.z<1.35){armedIn=true;ringMat.emissiveIntensity=7;msg.textContent='Portal erkannt – weiter hindurchgehen';}
   if(armedIn && insideOpening && p.z<-.16){armedIn=false;beginFade(1);}
   if(p.z>1.8)armedIn=false;
 }else if(state==='virtual'){
   if(insideOpening && p.z<-.18 && p.z>-1.35){armedOut=true;ringMat.emissiveIntensity=7;msg.textContent='Rückportal – weiter hindurchgehen';}
   if(armedOut && insideOpening && p.z>.16){armedOut=false;beginFade(-1);}
   if(p.z<-1.8)armedOut=false;
 }
}
function beginFade(dir){
 fadeDir=dir;fade=0;transitionSphere.visible=true;transitionSphere.material.opacity=0;
 ringMat.emissiveIntensity=12;msg.textContent=dir===1?'Übergang in die virtuelle Welt…':'Rückkehr zu AR/MR…';
}
function updateFade(dt){
 if(!fadeDir)return;
 fade=Math.min(1,fade+dt/1.5);
 cam.getWorldPosition(headWorld);transitionSphere.position.copy(headWorld);
 // Fade to opaque during first half, switch world at midpoint, fade away second half.
 const alpha=fade<.5 ? fade*2 : (1-fade)*2;
 transitionSphere.material.opacity=Math.min(.98,alpha);
 if(fade>=.5 && !transitionSphere.userData.switched){
   transitionSphere.userData.switched=true;
   if(fadeDir===1){state='virtual';virtual.visible=true;gardenFloor.visible=false;scene.background=new T.Color(0x100018);modeEl.textContent='Virtuelle Welt';}
   else{state='ar';virtual.visible=false;gardenFloor.visible=true;scene.background=null;modeEl.textContent='AR/MR';}
 }
 if(fade>=1){
   transitionSphere.visible=false;transitionSphere.material.opacity=0;transitionSphere.userData.switched=false;fadeDir=0;ringMat.emissiveIntensity=4;
   msg.textContent=state==='virtual'?'Virtuelle Welt – gehe zurück durch dasselbe Portal für AR':'AR/MR – Portal kann erneut betreten werden';
 }
}

async function support(){
 if(!navigator.xr){msg.textContent='Kein WebXR';return}
 let ok=await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
 ar.disabled=!ok;ar.textContent=ok?'Enter AR/MR':'AR nicht verfügbar';msg.textContent=ok?'AR/MR bereit':'immersive-ar nicht unterstützt';
}
ar.onclick=async()=>{
 try{
  scene.background=null;anchor.visible=false;virtual.visible=false;placed=false;state='ar';
  const ses=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['local-floor','dom-overlay'],domOverlay:{root:document.body}});
  ren.xr.setReferenceSpaceType('local');await ren.xr.setSession(ses);local=await ses.requestReferenceSpace('local');let viewer=await ses.requestReferenceSpace('viewer');hs=await ses.requestHitTestSource({space:viewer});
  modeEl.textContent='AR/MR';msg.textContent='Boden scannen und Portal platzieren';
  ses.addEventListener('end',()=>location.reload());
 }catch(e){msg.textContent='AR-Fehler: '+e.message}
};
place.onclick=()=>{
 if(!lastPose)return;
 let p=lastPose.transform.position;anchor.position.set(p.x,p.y,p.z);anchor.quaternion.set(0,0,0,1);anchor.visible=true;placed=true;ret.visible=false;place.style.display='none';
 msg.textContent='Portal platziert – nähere dich von vorne und gehe hindurch';
};
function resize(){if(ren.xr.isPresenting)return;let w=view.clientWidth,h=view.clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(view);resize();support();

ren.setAnimationLoop((t,frame)=>{
 let dt=Math.min(.04,(t-last)/1000);last=t;
 if(frame&&hs&&!placed){let hits=frame.getHitTestResults(hs);if(hits.length){lastPose=hits[0].getPose(local);ret.visible=true;ret.matrix.fromArray(lastPose.transform.matrix);place.style.display='block'}else{ret.visible=false;place.style.display='none'}}
 updatePortal();updateFade(dt);ring.rotation.z+=dt*.7;
 virtual.children.forEach(o=>{if(o.userData.base!==undefined)o.position.y=o.userData.base+Math.sin(t*.002+o.userData.phase)*.1});
 ren.render(scene,cam);
});
</script></body></html>
